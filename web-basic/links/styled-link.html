<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Styled Links</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 30px;
      }

      a {
        color: #2563eb;
        text-decoration: none;
        font-size: 18px;
      }

      a:hover {
        color: #dc2626;
        text-decoration: underline;
      }

      a:visited {
        color: #7c3aed;
      }

      a:active {
        color: #16a34a;
      }
    </style>
  </head>
  <body>
    <!-- Styled Links: These links use CSS to customize their appearance
     and provide visual feedback during user interaction. -->

    <h1>Styled HTML Links</h1>

    <p><a href="https://www.google.com">Visit Google</a></p>

    <p><a href="https://www.github.com">Visit GitHub</a></p>

    <p><a href="https://www.wikipedia.org">Visit Wikipedia</a></p>
  </body>
</html>
