<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Open Link in a New Tab: The target="_blank" attribute opens
     the linked website in a new tab or window.
     The rel="noopener noreferrer" attribute improves security
     and prevents the destination from accessing the originating page. -->

    <a href="https://www.github.com" target="_blank" rel="noopener noreferrer">
      Open GitHub
    </a>
  </body>
</html>
