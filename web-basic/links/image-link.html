<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Image Link: Makes an image clickable and redirects users
     to an external website when they click on it. -->

    <h1>Click the Image</h1>

    <a href="https://www.wikipedia.org">
      <img
        src="https://placehold.co/300x150"
        alt="Click to visit Wikipedia"
        width="300"
      />
    </a>
  </body>
</html>
