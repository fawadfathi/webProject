<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        text-align: center;
        color: #2563eb;
      }

      .left {
        text-align: left;
      }

      .center {
        text-align: center;
      }

      .right {
        text-align: right;
      }

      .highlight {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <!-- Text Alignment: Demonstrates how CSS controls the horizontal
     alignment of text and changes its color using text styling. -->

    <h1>Text Styling</h1>

    <p class="left">This text is aligned left.</p>

    <p class="center">This text is centered.</p>

    <p class="right">This text is aligned right.</p>

    <p class="highlight">This text is red.</p>
  </body>
</html>
