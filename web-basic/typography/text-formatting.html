<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Text Formatting: Demonstrates HTML tags used to change the
     appearance or meaning of text, including bold, important,
     italic, emphasized, underlined, highlighted, deleted, and inserted text. -->

    <p>This is <b>bold text</b>.</p>

    <p>This is <strong>important text</strong>.</p>

    <p>This is <i>italic text</i>.</p>

    <p>This is <em>emphasized text</em>.</p>

    <p>This is <u>underlined text</u>.</p>

    <p>This is <mark>highlighted text</mark>.</p>

    <p>This is <del>deleted text</del>.</p>

    <p>This is <ins>inserted text</ins>.</p>
  </body>
</html>
