<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Subscript and Superscript: Demonstrates how <sub> displays text
     below the normal text line and <sup> displays text above it.
     These tags are commonly used for chemical formulas,
     mathematical expressions, and units of measurement. -->

    <p>Water formula: H<sub>2</sub>O</p>

    <p>Carbon dioxide: CO<sub>2</sub></p>

    <p>Mathematics: x<sup>2</sup> + y<sup>2</sup></p>

    <p>Area: 5m<sup>2</sup></p>
  </body>
</html>
