<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .small {
        font-size: 12px;
      }

      .medium {
        font-size: 20px;
      }

      .large {
        font-size: 32px;
      }

      .serif {
        font-family: Georgia, serif;
      }

      .sans-serif {
        font-family: Arial, sans-serif;
      }

      .bold {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <!-- Font Properties: Demonstrates how CSS controls text size,
     font family, and font weight to change the appearance of text. -->

    <h1 class="large">Font Properties</h1>

    <p class="large">This is large text.</p>

    <p class="medium">This is medium text.</p>

    <p class="serif">This uses the Georgia font.</p>

    <p class="sans-serif">This uses the Arial font.</p>

    <p class="bold">This text is bold.</p>

    <p class="small">This is small text.</p>
  </body>
</html>
