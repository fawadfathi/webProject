<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- Paragraphs: Demonstrates how to organize text using the <p> tag,
     create a line break with <br>, and separate sections with <hr>. -->

    <h1>About Me</h1>

    <p>My name is Ahmad.</p>
    <p>I am learning HTML at university.</p>

    <p>
      HTML is easy to learn.<br />
      Practice makes you better.
    </p>

    <hr />

    <p>This is a new section.</p>
  </body>
</html>
