<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        letter-spacing: 4px;
      }

      .line-height {
        line-height: 2;
      }

      .word-spacing {
        word-spacing: 10px;
      }

      .uppercase {
        text-transform: uppercase;
      }

      .lowercase {
        text-transform: lowercase;
      }

      .capitalize {
        text-transform: capitalize;
      }
    </style>
  </head>
  <body>
    <!-- Advanced Typography: Demonstrates how CSS controls text appearance
     and readability using line height, word spacing, text transformation,
     uppercase, lowercase, and capitalization. -->

    <h1>Typography</h1>

    <p class="line-height">
      HTML is the foundation of web development. CSS makes websites attractive
      and readable. Practice these concepts to improve your skills.
    </p>

    <p class="word-spacing">Learn HTML and CSS.</p>

    <p class="uppercase">this text is uppercase.</p>

    <p class="lowercase">THIS TEXT IS LOWERCASE.</p>

    <p class="capitalize">this text capitalizes each word.</p>
  </body>
</html>
