<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }

      table {
        width: 40%;
      }
    </style>
  </head>
  <body>
    <!-- Basic HTML Table: Organizes data into rows and columns.
     <tr> defines a table row, <th> defines a header cell,
     and <td> defines a standard data cell. -->

    <table>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Grade</th>
      </tr>
      <tr>
        <td>Ahmad</td>
        <td>20</td>
        <td>A</td>
      </tr>
      <tr>
        <td>Ali</td>
        <td>21</td>
        <td>B</td>
      </tr>
    </table>
  </body>
</html>
