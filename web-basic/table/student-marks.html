<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Marks Table</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        padding: 30px;
      }

      h1 {
        text-align: center;
        color: #1e293b;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background-color: white;
      }

      th,
      td {
        padding: 14px;
        text-align: center;
        border: 1px solid #ddd;
      }

      th {
        background-color: #1e293b;
        color: white;
      }

      tr:nth-child(even) {
        background-color: #f1f5f9;
      }

      tr:hover {
        background-color: #dbeafe;
      }
    </style>
  </head>
  <body>
    <!-- Student Marks Table: Displays students' marks in different subjects
     and their total marks. <th> defines column headers, <tr> defines rows,
     and <td> contains each student's name and marks. -->

    <h1>Student Marks Table</h1>

    <table>
      <tr>
        <th>Student Name</th>
        <th>Mathematics</th>
        <th>Computer Science</th>
        <th>English</th>
        <th>Total Marks</th>
      </tr>
      <tr>
        <td>Ahmad</td>
        <td>85</td>
        <td>90</td>
        <td>80</td>
        <td>255</td>
      </tr>
      <tr>
        <td>Ali</td>
        <td>75</td>
        <td>88</td>
        <td>92</td>
        <td>255</td>
      </tr>
      <tr>
        <td>Omar</td>
        <td>95</td>
        <td>82</td>
        <td>89</td>
        <td>266</td>
      </tr>
      <tr>
        <td>Hassan</td>
        <td>78</td>
        <td>85</td>
        <td>90</td>
        <td>253</td>
      </tr>
    </table>
  </body>
</html>
